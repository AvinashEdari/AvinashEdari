name: Generate Themed Contribution Snakes

"on":
  schedule:
    # Runs daily at 00:17 UTC (05:47 IST).
    - cron: "17 0 * * *"
  workflow_dispatch: {}

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Generate four themed snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: AvinashEdari
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake-cyan.svg?palette=github-light&color_snake=#7C3AED&color_dots=#EBF8FF,#BAE6FD,#67E8F9,#3B82F6,#7C3AED
            dist/github-contribution-grid-snake-cyan-dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#0D1117,#12304A,#164E63,#2563EB,#7C3AED

      - name: Save a downloadable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: contribution-snakes-${{ github.run_number }}
          path: dist
          if-no-files-found: error
          retention-days: 14

      - name: Publish SVGs to the output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
          commit_message: "chore: refresh contribution snakes"

      - name: Add links to the workflow summary
        shell: bash
        run: |
          {
            echo "## Contribution snakes generated successfully"
            echo ""
            echo "Published four SVG animations to the \`output\` branch:"
            echo ""
            echo "- [Standard light](https://raw.githubusercontent.com/${{ github.repository }}/output/github-contribution-grid-snake.svg)"
            echo "- [Standard dark](https://raw.githubusercontent.com/${{ github.repository }}/output/github-contribution-grid-snake-dark.svg)"
            echo "- [Cyan-purple light](https://raw.githubusercontent.com/${{ github.repository }}/output/github-contribution-grid-snake-cyan.svg)"
            echo "- [Cyan-purple dark](https://raw.githubusercontent.com/${{ github.repository }}/output/github-contribution-grid-snake-cyan-dark.svg)"
          } >> "$GITHUB_STEP_SUMMARY"
